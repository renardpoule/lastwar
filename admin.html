<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Poste de commandement</title>
<meta name="theme-color" content="#16131f">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="style.css?v=8">
<link rel="stylesheet" href="admin.css?v=8">
</head>
<body class="ds admin verrouille">
<form id="connexion" class="connexion ds-card" hidden autocomplete="on">
  <img class="logo" src="logo.png" width="72" height="72" alt="">
  <h1 class="ds-section-title">Poste de commandement</h1>
  <p class="ds-supporting">Accès réservé au Conseil.</p>
  <div class="ds-field"><label class="ds-label" for="cxId">Identifiant</label><input class="ds-input" id="cxId" name="username" autocomplete="username" required></div>
  <div class="ds-field"><label class="ds-label" for="cxMdp">Mot de passe</label><input class="ds-input" id="cxMdp" name="password" type="password" autocomplete="current-password" required></div>
  <p id="cxErreur" class="cx-erreur" role="alert" hidden></p>
  <button class="ds-btn ds-btn-primary" type="submit">Se connecter</button>
  <a class="ds-btn ds-btn-ghost" href="./">Retour à la carte</a>
</form>
<header class="topbar">
  <div class="identite">
    <img class="logo" src="logo.png" width="44" height="44" alt="Sceau de la Confédération des Cendres">
    <div>
      <h1>Poste de commandement</h1>
      <p class="ds-supporting" id="etatPub" role="status">Chargement…</p>
    </div>
  </div>
  <div class="actions">
    <nav class="nav-site" aria-label="Site"><a class="ds-btn ds-btn-ghost" href="./">Carte</a><a class="ds-btn ds-btn-ghost" href="secteurs.html">Secteurs</a><span class="ds-btn ds-btn-ghost actif" aria-current="page">Administratif</span></nav>
    <button class="ds-btn ds-btn-ghost" id="btnDeconnexion" type="button">Se déconnecter</button>
    <a class="ds-btn ds-btn-ghost" href="./" target="_blank" rel="noopener" hidden>Voir la carte <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h6m9 2V4h-5m-5 10l9.5-9.5"/></svg></a>
    <button class="ds-btn ds-btn-outline" id="btnTelecharger" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M13 3a1 1 0 1 0-2 0zm-2 13a1 1 0 1 0 2 0zm-1.828-4a1 1 0 1 0-1.415 1.414l.707-.707zM12 16.243l-.707.707a1 1 0 0 0 1.414 0zm4.243-2.829A1 1 0 1 0 14.828 12l.708.707zM20 7h-1v13h2V7zm-1 14v-1H5v2h14zM4 20h1V7H3v13zM5 6v1h3V5H5zm11 0v1h3V5h-3zm-4-3h-1v13h2V3zm-3.536 9.707l-.707.707l3.536 3.536l.707-.707l.707-.707L9.172 12zM12 16.243l.707.707l3.536-3.536l-.707-.707l-.708-.707l-3.535 3.536zM4 7h1V5a2 2 0 0 0-2 2zm1 14v-1H3a2 2 0 0 0 2 2zm15-1h-1v2a2 2 0 0 0 2-2zm0-13h1a2 2 0 0 0-2-2v2z"/></svg>Télécharger data.json</button>
    <button class="ds-btn ds-btn-primary" id="btnPublier" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9H6a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V10a1 1 0 0 0-1-1h-2m-4-6v11m2.5-8.5L12 3L9.5 5.5"/></svg>Publier</button>
  </div>
</header>

<div id="avis" class="avis" role="status" hidden></div>

<nav class="onglets-wrap" aria-label="Sections du poste de commandement">
  <div class="ds-tabs onglets" id="onglets" role="tablist">
    <button class="ds-tab active" role="tab" aria-selected="true" data-onglet="situation">Situation</button>
    <button class="ds-tab" role="tab" aria-selected="false" data-onglet="evenements">Événements</button>
    <button class="ds-tab" role="tab" aria-selected="false" data-onglet="districts">Districts</button>
    <button class="ds-tab" role="tab" aria-selected="false" data-onglet="zones">Zones</button>
    <button class="ds-tab" role="tab" aria-selected="false" data-onglet="villes">Villes</button>
    <button class="ds-tab" role="tab" aria-selected="false" data-onglet="dossiers">Dossiers</button>
    <button class="ds-tab" role="tab" aria-selected="false" data-onglet="secteurs">Secteurs</button>
    <button class="ds-tab" role="tab" aria-selected="false" data-onglet="reglages">Réglages</button>
  </div>
</nav>

<main id="contenu" class="contenu"></main>

<dialog id="dlgPublier" class="dlg" aria-labelledby="pubTitre"></dialog>
<div id="toast" class="toast" role="status" hidden></div>

<script src="common.js?v=8"></script>
<script src="auth.js?v=8"></script>
<script src="admin.js?v=8"></script>
</body>
</html>
