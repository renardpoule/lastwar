<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Front des Cendres</title>
<meta name="description" content="Situation du conflit entre la Confédération des Cendres et les Cultistes.">
<meta name="theme-color" content="#16131f">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preload" href="countries.json" as="fetch" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body class="ds">
<header class="topbar">
  <div class="identite">
    <img class="logo" src="logo.png" width="44" height="44" alt="Sceau de la Confédération des Cendres">
    <div>
      <h1 id="titre">Confédération des Cendres</h1>
      <p id="soustitre" class="ds-supporting"></p>
    </div>
  </div>
  <div class="daterp">
    <strong id="daterp">—</strong>
    <span id="maj" class="ds-supporting"></span>
  </div>
  <nav class="nav-site" aria-label="Site"><span class="ds-btn ds-btn-ghost actif" aria-current="page">Carte</span><a class="ds-btn ds-btn-ghost" href="secteurs.html">Secteurs</a><a class="ds-btn ds-btn-ghost" href="admin.html">Administratif</a></nav>
  <button id="tensionBtn" class="tension-mini" type="button" aria-haspopup="dialog">
    <svg id="miniClock" viewBox="0 0 100 100" aria-hidden="true"></svg>
    <span class="tm-txt">
      <span class="tm-val"><strong id="tensionVal">—</strong> <span class="ds-supporting">Tension</span></span>
      <span id="tensionPalier" class="ds-badge"></span>
    </span>
  </button>
</header>

<div id="alerte" class="alerte" role="status" hidden></div>

<main class="layout">
  <section class="mapzone" aria-label="Carte du conflit">
    <div id="map" class="map"></div>
    <div id="distorsion" class="distorsion" aria-hidden="true" hidden><div class="d-bruit"></div><div class="d-lignes"></div><div class="d-vignette"></div><div class="d-coupure"></div></div>
    <div class="map-ui">
      <nav id="fil" class="fil" aria-label="Fil d'Ariane"></nav>
      <button id="btnLegende" class="ds-btn ds-btn-secondary ds-btn-sm btn-legende" type="button" aria-expanded="false" aria-controls="legende">Légende</button>
      <ul class="legende" id="legende" aria-label="Légende"></ul>
    </div>
    <div id="archive" class="archive" role="status" hidden></div>
    <div class="timeline">
      <button id="play" class="ds-btn ds-btn-secondary ds-btn-sm" type="button" aria-label="Rejouer le conflit"></button>
      <label class="sr" for="slider">Chronologie du conflit</label>
      <input id="slider" type="range" min="0" max="0" value="0">
      <span id="sliderLbl" class="slider-lbl">En direct</span>
    </div>
    <div id="tip" class="tip" hidden></div>
  </section>

  <aside id="panel" class="panel" aria-live="polite"></aside>
</main>

<dialog id="tensionDlg" class="dlg" aria-labelledby="tensionTitre">
  <button class="ds-btn ds-btn-ghost ds-btn-sm fermer" type="button" aria-label="Fermer" onclick="this.closest('dialog').close()"></button>
  <div id="tensionDetail"></div>
</dialog>

<script src="lib/d3.min.js"></script>
<script src="lib/topojson-client.min.js"></script>
<script src="common.js"></script>
<script src="villes.js"></script>
<script src="app.js"></script>
</body>
</html>
