<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Front des Cendres</title>
<meta name="description" content="Situation du conflit entre la Confédération des Cendres et les Cultistes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg class="sigle" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 L29 9 V23 L16 30 L3 23 V9 Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 8 L22 19 H10 Z" fill="currentColor"/></svg>
    <div>
      <h1 id="titre">Confédération des Cendres</h1>
      <p id="soustitre" class="muted"></p>
    </div>
  </div>
  <div class="daterp">
    <span class="lbl">Date</span>
    <strong id="daterp">—</strong>
    <span id="maj" class="muted small"></span>
  </div>
  <button id="tensionBtn" class="tension-mini" aria-label="Détails de la tension mondiale">
    <svg id="miniClock" viewBox="0 0 60 60" aria-hidden="true"></svg>
    <span class="tm-txt">
      <span class="lbl">Tension mondiale</span>
      <strong id="tensionVal">—</strong>
      <span id="tensionPalier" class="palier"></span>
    </span>
  </button>
</header>

<div id="alerte" class="alerte" hidden></div>

<main class="layout">
  <section class="mapzone">
    <div id="archive" class="archive" hidden></div>
    <div id="map" class="map" aria-label="Carte de la Confédération"></div>
    <div class="map-ui">
      <nav id="fil" class="fil" aria-label="Navigation"></nav>
      <div class="legende">
        <span><i class="sw" style="--c:var(--ok)"></i>Sous contrôle</span>
        <span><i class="sw" style="--c:var(--st-conteste)"></i>Contesté</span>
        <span><i class="sw" style="--c:var(--st-reconquete)"></i>Reconquête</span>
        <span><i class="sw hatch"></i>Quarantaine</span>
        <span><i class="sw" style="--c:var(--cult)"></i>Perdu</span>
      </div>
    </div>
    <div class="timeline">
      <button id="play" class="play" aria-label="Rejouer le conflit">▶</button>
      <input id="slider" type="range" min="0" max="0" value="0" aria-label="Chronologie du conflit">
      <span id="sliderLbl" class="slider-lbl">EN DIRECT</span>
    </div>
    <div id="tip" class="tip" hidden></div>
  </section>

  <aside id="panel" class="panel" aria-live="polite"></aside>
</main>

<dialog id="tensionDlg" class="dlg">
  <button class="close" onclick="this.closest('dialog').close()" aria-label="Fermer">✕</button>
  <div id="tensionDetail"></div>
</dialog>

<script src="lib/d3.min.js"></script>
<script src="lib/topojson-client.min.js"></script>
<script src="common.js"></script>
<script src="app.js"></script>
</body>
</html>
